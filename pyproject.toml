[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulinstruct-repro"
version = "0.5.7"
description = "VulInstruct specification-guided vulnerability detection and evaluation"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
embedding = ["numpy>=1.24", "torch>=2.2", "transformers>=4.51,<5"]
data = ["pyarrow>=14"]
test = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
vulinstruct = "vulinstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

